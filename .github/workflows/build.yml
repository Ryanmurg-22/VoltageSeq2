name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── macOS ARM64 ─────────────────────────────────────────────────────────────
  build-mac:
    name: macOS (Apple Silicon)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (CMake)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package as .pkg
        run: |
          VST3=$(find build -name "VoltageSeq2.vst3" -type d | head -1)
          AU=$(find build -name "VoltageSeq2.component" -type d | head -1)
          echo "Found VST3 at: $VST3"
          echo "Found AU at:   $AU"

          # VST3 component pkg
          mkdir -p pkg_vst3
          cp -r "$VST3" pkg_vst3/
          pkgbuild --root pkg_vst3 \
                   --install-location "/Library/Audio/Plug-Ins/VST3" \
                   --identifier "com.MurgatroydInstruments.VoltageSeq2.vst3" \
                   --version "${{ github.ref_name }}" \
                   vst3.pkg

          # AU component pkg
          mkdir -p pkg_au
          cp -r "$AU" pkg_au/
          pkgbuild --root pkg_au \
                   --install-location "/Library/Audio/Plug-Ins/Components" \
                   --identifier "com.MurgatroydInstruments.VoltageSeq2.au" \
                   --version "${{ github.ref_name }}" \
                   au.pkg

          # Bundle both into one installer
          productbuild --package vst3.pkg --package au.pkg \
                       VoltageSeq2_macOS_ARM64.pkg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-pkg
          path: VoltageSeq2_macOS_ARM64.pkg

  # ── GitHub Release ───────────────────────────────────────────────────────────
  release:
    name: Publish Release
    needs: [build-mac]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Rename with version tag
        run: mv mac-pkg/VoltageSeq2_macOS_ARM64.pkg VoltageSeq2_${{ github.ref_name }}_macOS_ARM64.pkg

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: VoltageSeq2_${{ github.ref_name }}_macOS_ARM64.pkg

  # ── Windows (disabled — coming soon) ────────────────────────────────────────
