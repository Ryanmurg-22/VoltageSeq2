name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── macOS Universal (arm64 + x86_64) ─────────────────────────────────────────
  build-mac:
    name: macOS (Universal)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (CMake)
        # Build one fat binary for Apple Silicon + Intel. The deployment target
        # sets the oldest macOS the (Intel) slice will run on — 10.13 is JUCE 8's
        # supported floor.
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package as .pkg
        run: |
          VER="${{ github.ref_name }}"; VER="${VER#v}"   # pkg version must be numeric, not the 'v5.1.2' tag
          VST3=$(find build -name "VoltageSeq2.vst3" -type d | head -1)
          AU=$(find build -name "VoltageSeq2.component" -type d | head -1)
          echo "Found VST3 at: $VST3"
          echo "Found AU at:   $AU"

          # CRITICAL: JUCE gives every format ONE shared CFBundleIdentifier
          # (com.<company>.<target>), and with a spaced company name it was even
          # invalid ("com.Murgatroyd Instruments.VoltageSeq2"). When two payloads
          # in a single product share a CFBundleIdentifier, the macOS Installer's
          # bundle bookkeeping writes only ONE of them — which silently dropped the
          # VST3 on end-user machines (the dev never runs the .pkg, so never saw it).
          # Rewrite each bundle to a DISTINCT, valid id, then re-sign (editing
          # Info.plist invalidates the ad-hoc signature).
          VST3_ID="com.murgatroydinstruments.voltageseq2.vst3"
          AU_ID="com.murgatroydinstruments.voltageseq2.component"
          mkdir -p pkg_vst3 pkg_au
          cp -r "$VST3" pkg_vst3/
          cp -r "$AU"   pkg_au/
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $VST3_ID" "pkg_vst3/VoltageSeq2.vst3/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $AU_ID"   "pkg_au/VoltageSeq2.component/Contents/Info.plist"
          codesign --force --deep --sign - "pkg_vst3/VoltageSeq2.vst3"
          codesign --force --deep --sign - "pkg_au/VoltageSeq2.component"

          # Guard: the two ids MUST differ, or the installer will drop one again.
          GOT_VST3=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "pkg_vst3/VoltageSeq2.vst3/Contents/Info.plist")
          GOT_AU=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "pkg_au/VoltageSeq2.component/Contents/Info.plist")
          echo "VST3 bundle id: $GOT_VST3"; echo "AU   bundle id: $GOT_AU"
          [ "$GOT_VST3" != "$GOT_AU" ] || { echo "::error::VST3 and AU share a CFBundleIdentifier"; exit 1; }

          # VST3 component pkg
          pkgbuild --root pkg_vst3 \
                   --install-location "/Library/Audio/Plug-Ins/VST3" \
                   --identifier "com.MurgatroydInstruments.VoltageSeq2.vst3" \
                   --version "$VER" \
                   vst3.pkg

          # AU component pkg
          pkgbuild --root pkg_au \
                   --install-location "/Library/Audio/Plug-Ins/Components" \
                   --identifier "com.MurgatroydInstruments.VoltageSeq2.au" \
                   --version "$VER" \
                   au.pkg

          # Bundle both into one installer
          productbuild --package vst3.pkg --package au.pkg \
                       VoltageSeq2_macOS_Universal.pkg

          # Sanity-check the shipped binaries are actually fat (both slices).
          for b in "$VST3/Contents/MacOS/VoltageSeq2" "$AU/Contents/MacOS/VoltageSeq2"; do
            echo "archs in $b:"; lipo -archs "$b"
            lipo -archs "$b" | grep -q x86_64 && lipo -archs "$b" | grep -q arm64 \
              || { echo "::error::$b is not universal"; exit 1; }
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-pkg
          path: VoltageSeq2_macOS_Universal.pkg

  # ── Windows x64 ──────────────────────────────────────────────────────────────
  build-windows:
    name: Windows (x64)
    runs-on: windows-latest
    # Non-blocking: a Windows failure must never stop the macOS release shipping.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (CMake)
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer (.exe)
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" installer\windows\VoltageSeq2.iss

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installer/windows/Output/*.exe

  # ── GitHub Release ───────────────────────────────────────────────────────────
  release:
    name: Publish Release
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Rename macOS pkg with version tag
        run: mv mac-pkg/VoltageSeq2_macOS_Universal.pkg VoltageSeq2_${{ github.ref_name }}_macOS_Universal.pkg

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false   # ship Mac even if the Windows .exe is absent
          files: |
            VoltageSeq2_${{ github.ref_name }}_macOS_Universal.pkg
            windows-installer/*.exe
